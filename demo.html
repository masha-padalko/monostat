<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonoStat — демо</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='72' text-anchor='middle'%3E%F0%9F%92%B8%3C/text%3E%3C/svg%3E">
  <!-- тема: збережений вибір, інакше як на пристрої — ставиться до малювання сторінки, без блимання -->
  <script>try{var t=localStorage.getItem('monostat_theme');if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css?v=20261120c">
</head>
<body>
  <!--
    Демо-версія MonoStat: той самий js/app.js, але з window.MS_DEMO = true.
    У цьому режимі немає входу, Supabase і запитів до Monobank — дані беруться з
    js/demo-data.js (місяць реальних операцій зі зміненими сумами та іменами)
    і живуть лише в пам'яті сторінки.
  -->
  <div class="ms-root">
    <div class="ms-inner">
      <header class="ms-topbar">
        <a class="ms-logo" href="demo.html" aria-label="MonoStat — на головну"><span class="ms-logo-mark" aria-hidden="true"></span>MonoStat</a>
        <nav id="ms-nav-slot" class="ms-nav" aria-label="Розділи"></nav>
        <div class="ms-header-right"><button type="button" class="ms-theme-btn" id="themeBtn" title="Темна / світла тема" aria-label="Перемкнути темну тему" aria-pressed="false"><svg class="ic-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="ic-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><span class="ms-header-link">Демо</span></div>
      </header>
      <div class="ms-hero-head">
        <div class="ms-hero-text">
          <p class="ms-eyebrow">Демо-версія</p>
          <h1 class="ms-h1" id="ms-quote"></h1><!-- випадкова цитата про гроші, підставляє js/app.js -->
        </div>
        <div id="ms-hero-slot" class="ms-hero-side"></div><!-- вибір періоду, підставляє js/app.js -->
      </div>

      <div id="app"></div>

      <div class="ms-footer-note">Демо-дані: реальна структура витрат за один місяць, суми змінені на ±15%, імена людей замінені. Зміни на цій сторінці ніде не зберігаються.</div>
    </div>
  </div>

  <script>window.MS_DEMO = true;</script>
  <script src="js/data.js?v=20261120c"></script>
  <script src="js/demo-data.js?v=20261120c"></script>
  <script src="js/app.js?v=20261120c"></script>
</body>
</html>
