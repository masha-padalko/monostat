<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonoStat — особиста статистика Monobank</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='72' text-anchor='middle'%3E%F0%9F%92%B8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=20261112f">
</head>
<body>
  <!--
    MonoStat — персональний фінансовий трекер на базі Monobank Open API.
    Файлова структура проєкту:
      index.html   — цей файл: статична шапка/підвал + підключення css/style.css / js/data.js / js/app.js
      style.css    — всі стилі та кольорові токени
      data.js      — "запечені" дефолти (зараз порожні — реальні дані живуть у Supabase)
      app.js       — вся логіка застосунку: підключення до API, категоризація,
                     рендеринг усіх панелей, зберігання даних.
    Шапка й підвал — статичний HTML, ніколи не перебудовується заново. render() у
    app.js чіпає лише #app (динамічний вміст, залежний від стану) — так швидше й
    менше зайвої роботи на кожен виклик render().
    Працює без білд-кроку — просто відкрити index.html у браузері
    (або "Додати на екран Домой" як PWA).
  -->
  <div class="ms-root">
    <div class="ms-inner">
      <header class="ms-topbar">
        <a class="ms-logo" href="index.html" aria-label="MonoStat — на головну"><span class="ms-logo-mark" aria-hidden="true"></span>MonoStat</a>
        <nav id="ms-nav-slot" class="ms-nav" aria-label="Розділи"></nav>
        <div class="ms-header-right">
          <a class="ms-header-link" href="balances.html">Баланси</a>
          <div id="ms-signout-slot" class="ms-header-right"></div>
        </div>
      </header>
      <div class="ms-hero-head">
        <p class="ms-eyebrow">Мої фінанси</p>
        <h1 class="ms-h1" id="ms-quote"></h1><!-- випадкова цитата про гроші, підставляє js/app.js -->
      </div>

      <div id="app"></div>

      <div class="ms-footer-note">Виписка завантажується напряму з api.monobank.ua у твоєму браузері. Токен Monobank зберігається лише в браузері. Категорії, нотатки, поїздки й ручні записи синхронізуються з твоїм акаунтом у базі (Supabase) і доступні лише тобі.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js?v=20261112f"></script>
  <script src="js/app.js?v=20261112f"></script>
</body>
</html>
