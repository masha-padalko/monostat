<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- banknote -->
  <g transform="rotate(-14 70 52)">
    <rect x="14" y="24" width="112" height="58" rx="9" fill="#E9D3A4"/>
    <rect x="22" y="32" width="96" height="42" rx="6" fill="none" stroke="#C99B55" stroke-width="2.4"/>
    <circle cx="70" cy="53" r="13" fill="#D9B36E"/>
    <text x="70" y="59" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#FFFCF5">₴</text>
    <circle cx="35" cy="53" r="3.5" fill="#C99B55"/>
    <circle cx="105" cy="53" r="3.5" fill="#C99B55"/>
  </g>
  <!-- coin stack -->
  <g>
    <ellipse cx="122" cy="104" rx="24" ry="8" fill="#B8863F"/>
    <rect x="98" y="94" width="48" height="10" fill="#B8863F"/>
    <ellipse cx="122" cy="94" rx="24" ry="8" fill="#D9B36E"/>
    <ellipse cx="122" cy="88" rx="24" ry="8" fill="#B8863F"/>
    <rect x="98" y="78" width="48" height="10" fill="#B8863F"/>
    <ellipse cx="122" cy="78" rx="24" ry="8" fill="#E2C07F"/>
    <ellipse cx="122" cy="78" rx="15" ry="4.6" fill="none" stroke="#B8863F" stroke-width="2"/>
  </g>
  <!-- single coin -->
  <circle cx="84" cy="100" r="13" fill="#D9B36E" stroke="#B8863F" stroke-width="2.4"/>
  <text x="84" y="105" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#FFFCF5">₴</text>
</svg>
